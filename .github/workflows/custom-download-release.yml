# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: dawidd6 Download - Release
on: workflow_dispatch 

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Print github context so I can see what's available
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"


    - name: Print git sha info
      run: echo "github.sha -> ${{ github.sha }}" && echo "github.base_ref-> ${{ github.base_ref }}"

    - name: Download artifact
      id: download-artifact
      uses: dawidd6/action-download-artifact@v27
      with:
        path: .
        workflow: custom-download-build.yml
        workflow_conclusion: success
        # branch: main
        ref: ${{ github.sha }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
   
    - name: Show artifact
      shell: pwsh
      run: ls ./artifact && Get-content ./artifact/test.txt
    
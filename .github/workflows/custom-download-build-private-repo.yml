# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: dawidd6 Download - Build - private repo compatible
on: 
  push: 
    branches: [main]
  workflow_dispatch: 
    inputs:
      trigger-release: 
        type: boolean
        description: Trigger the release workflow after a successful build. Defaults to false.
        required: false
        default: false
      commit: 
        type: string
        description: Commit you want to deploy. Defaults to latest commit (github.sha)
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    env: 
      artifact_dir: ./artifact
    steps:
    - name: ensure artifact directory
      shell: pwsh
      run: new-item -ItemType Directory -Force -Path $env:artifact_dir
    - name: Make an artifact
      shell: pwsh
      run:  Set-content -Path $env:artifact_dir/test.txt -Value "hi $(Get-Date)"

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.0
      with:
        # A file, directory or wildcard pattern that describes what to upload
        path: ./artifact

  trigger-release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.trigger-release == 'true' }}
    # permissions: 
    #   actions: read
    #   contents: read
    # uses: ./.github/workflows/custom-download-release.yml
    # with:
    #   commit: ${{ github.event.inputs.commit || github.sha }}

    ## Trigger the flow with the github CLI instead so we have the correct release history
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: write
      contents: read
    steps:
    - run: gh workflow run custom-download-release.yml --ref ${{github.ref}} -f commit=${{github.event.inputs.commit || github.sha}} --repo ${{github.repositoryUrl}}
    